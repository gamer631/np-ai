name: Bootstrap backend lockfile

on:
  push:
    branches:
      - feat/sprint-001-api-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-bootstrap-backend
  cancel-in-progress: false

jobs:
  lockfile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/sprint-001-api-hardening
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile from the branch manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        run: |
          if [ -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "build: add reproducible backend npm lockfile"
              git push origin HEAD:feat/sprint-001-api-hardening
            fi
          else
            echo "npm did not generate package-lock.json" >&2
            exit 1
          fi

      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run security tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
