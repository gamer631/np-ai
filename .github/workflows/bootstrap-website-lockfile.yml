name: Bootstrap website lockfile

on:
  push:
    branches:
      - nil-ai/ecosystem-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-bootstrap-website
  cancel-in-progress: false

jobs:
  lockfile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: nil-ai/ecosystem-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile from website manifest
        working-directory: website
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated website lockfile
        run: |
          if [ -f website/package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add website/package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "build: add reproducible website npm lockfile"
              git push origin HEAD:nil-ai/ecosystem-foundation
            fi
          else
            echo "npm did not generate website/package-lock.json" >&2
            exit 1
          fi

      - name: Install exactly from website lockfile
        working-directory: website
        run: npm ci --no-audit --no-fund

      - name: Audit website dependencies
        working-directory: website
        run: npm audit --audit-level=high

      - name: Run website ESLint
        working-directory: website
        run: npm run lint

      - name: Website TypeScript typecheck
        working-directory: website
        run: npm run typecheck

      - name: Website production build
        working-directory: website
        run: npm run build
