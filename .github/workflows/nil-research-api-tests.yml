name: NIL Research API tests

on:
  push:
    branches:
      - main
      - feat/nil-research-workbench-ui
    paths:
      - "nil-research-api/**"
      - ".github/workflows/nil-research-api-tests.yml"
  pull_request:
    paths:
      - "nil-research-api/**"
      - ".github/workflows/nil-research-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nil-research-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nil-research-api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
