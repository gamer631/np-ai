name: NILcenter Python SDK

on:
  push:
    paths:
      - "python/nilcenter-sdk/**"
      - ".github/workflows/nilcenter-python-sdk.yml"
  pull_request:
    paths:
      - "python/nilcenter-sdk/**"
      - ".github/workflows/nilcenter-python-sdk.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: python/nilcenter-sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/nilcenter-sdk/pyproject.toml
      - name: Install SDK and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest
      - name: Check formatting and lint
        run: ruff check src tests
