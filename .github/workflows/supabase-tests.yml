name: Supabase database tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-tests.yml"
  push:
    branches:
      - "feat/**"
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-tests.yml"

permissions:
  contents: read

concurrency:
  group: supabase-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start -x studio,edge-runtime,logflare,vector,analytics

      - name: Apply migrations from a clean database
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db
